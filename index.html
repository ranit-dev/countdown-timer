<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet">

<div id="app" style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; position: relative; overflow: hidden; transition: background-color 0.4s ease, color 0.4s ease;">
  <!-- Theme toggle button -->
  <button id="themeToggle" style="position: absolute; top: 2rem; right: 2rem; background: transparent; border: 1px solid; border-radius: 50%; width: 48px; height: 48px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 20px; transition: all 0.3s ease; z-index: 10;" aria-label="Toggle theme">
    <span id="themeIcon">○</span>
  </button>
  
  <!-- Subtle grid background -->
  <div id="gridBg" style="position: absolute; inset: 0; transition: opacity 0.4s ease;"></div>
  
  <div style="text-align: center; position: relative; z-index: 1;">
    <!-- Minimal top accent line -->
    <div id="topLine" style="width: 80px; height: 1px; margin: 0 auto 4rem; transition: background 0.4s ease;"></div>
    
    <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 2.5rem; margin-bottom: 4rem;">
      <div class="time-unit">
        <div class="number-container">
          <div class="number" id="days">00</div>
        </div>
        <div class="label">days</div>
      </div>
      <div class="time-unit">
        <div class="number-container">
          <div class="number" id="hours">00</div>
        </div>
        <div class="label">hours</div>
      </div>
      <div class="time-unit">
        <div class="number-container">
          <div class="number" id="minutes">00</div>
        </div>
        <div class="label">minutes</div>
      </div>
      <div class="time-unit">
        <div class="number-container">
          <div class="number" id="seconds">00</div>
        </div>
        <div class="label">seconds</div>
      </div>
    </div>
    
    <div id="dateLabel" style="font-size: 11px; font-weight: 400; letter-spacing: 1.8px; text-transform: uppercase; transition: color 0.4s ease;">
      Until 11:00 AM, June 13, 2026
    </div>
    
    <!-- Minimal bottom accent line -->
    <div id="bottomLine" style="width: 80px; height: 1px; margin: 4rem auto 0; transition: background 0.4s ease;"></div>
  </div>
</div>

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  
  .time-unit {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1rem;
  }
  
  .number-container {
    position: relative;
    padding: 1.5rem 0;
  }
  
  .number-container::before,
  .number-container::after {
    content: '';
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    width: 120px;
    height: 1px;
    transition: background 0.4s ease;
  }
  
  .number-container::before {
    top: 0;
  }
  
  .number-container::after {
    bottom: 0;
  }
  
  .number {
    font-size: 104px;
    font-weight: 300;
    line-height: 1;
    font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
    letter-spacing: -0.05em;
    min-width: 160px;
    font-variant-numeric: tabular-nums;
    transition: color 0.4s ease;
  }
  
  .label {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 2.4px;
    text-transform: uppercase;
    font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
    transition: color 0.4s ease;
  }
  
  #themeToggle:hover {
    transform: scale(1.1);
  }
  
  #themeToggle:active {
    transform: scale(0.95);
  }
  
  /* Dark theme (default) */
  .dark #app {
    background: #000000;
  }
  
  .dark .number {
    color: #FFFFFF;
  }
  
  .dark .label {
    color: rgba(255, 255, 255, 0.42);
  }
  
  .dark #dateLabel {
    color: rgba(255, 255, 255, 0.32);
  }
  
  .dark .number-container::before,
  .dark .number-container::after {
    background: rgba(255, 255, 255, 0.12);
  }
  
  .dark #topLine,
  .dark #bottomLine {
    background: rgba(255, 255, 255, 0.2);
  }
  
  .dark #gridBg {
    opacity: 0.03;
    background-image: repeating-linear-gradient(0deg, #FFFFFF 0px, #FFFFFF 1px, transparent 1px, transparent 40px), 
                      repeating-linear-gradient(90deg, #FFFFFF 0px, #FFFFFF 1px, transparent 1px, transparent 40px);
  }
  
  .dark #themeToggle {
    color: #FFFFFF;
    border-color: rgba(255, 255, 255, 0.25);
  }
  
  .dark #themeToggle:hover {
    background: rgba(255, 255, 255, 0.08);
    border-color: rgba(255, 255, 255, 0.4);
  }
  
  /* Light theme */
  .light #app {
    background: #FFFFFF;
  }
  
  .light .number {
    color: #000000;
  }
  
  .light .label {
    color: rgba(0, 0, 0, 0.42);
  }
  
  .light #dateLabel {
    color: rgba(0, 0, 0, 0.32);
  }
  
  .light .number-container::before,
  .light .number-container::after {
    background: rgba(0, 0, 0, 0.12);
  }
  
  .light #topLine,
  .light #bottomLine {
    background: rgba(0, 0, 0, 0.2);
  }
  
  .light #gridBg {
    opacity: 0.03;
    background-image: repeating-linear-gradient(0deg, #000000 0px, #000000 1px, transparent 1px, transparent 40px), 
                      repeating-linear-gradient(90deg, #000000 0px, #000000 1px, transparent 1px, transparent 40px);
  }
  
  .light #themeToggle {
    color: #000000;
    border-color: rgba(0, 0, 0, 0.25);
  }
  
  .light #themeToggle:hover {
    background: rgba(0, 0, 0, 0.05);
    border-color: rgba(0, 0, 0, 0.4);
  }
</style>

<script>
  const targetDate = new Date('2026-06-13T11:00:00').getTime();
  const root = document.documentElement;
  const themeToggle = document.getElementById('themeToggle');
  const themeIcon = document.getElementById('themeIcon');
  
  // Initialize theme
  let isDark = true;
  root.classList.add('dark');
  
  // Theme toggle
  themeToggle.addEventListener('click', () => {
    isDark = !isDark;
    root.classList.toggle('dark', isDark);
    root.classList.toggle('light', !isDark);
    themeIcon.textContent = isDark ? '○' : '●';
  });
  
  function updateCountdown() {
    const now = new Date().getTime();
    const distance = targetDate - now;
    
    if (distance < 0) {
      document.getElementById('days').textContent = '00';
      document.getElementById('hours').textContent = '00';
      document.getElementById('minutes').textContent = '00';
      document.getElementById('seconds').textContent = '00';
      return;
    }
    
    const days = Math.floor(distance / (1000 * 60 * 60 * 24));
    const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
    const seconds = Math.floor((distance % (1000 * 60)) / 1000);
    
    document.getElementById('days').textContent = String(days).padStart(2, '0');
    document.getElementById('hours').textContent = String(hours).padStart(2, '0');
    document.getElementById('minutes').textContent = String(minutes).padStart(2, '0');
    document.getElementById('seconds').textContent = String(seconds).padStart(2, '0');
  }
  
  updateCountdown();
  setInterval(updateCountdown, 1000);
</script>
